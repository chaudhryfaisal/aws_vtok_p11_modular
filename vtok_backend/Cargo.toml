[package]
name = "vtok_backend"
version = "0.1.0"
edition = "2021"
authors = ["AWS vTok Team"]
description = "Foundational abstraction layer for modular PKCS#11 crypto backends"
license = "Apache-2.0"
repository = "https://github.com/aws/aws-vtok-p11-modular"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1.0", features = ["io-util"], optional = true }
vtok_common = { path = "../vtok_common" }

[features]
default = []
async-io = ["tokio"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }